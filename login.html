<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="card auth-card">
    <div class="auth-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to keep your focus streak going.</p>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" class="input" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" class="input" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>

    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
