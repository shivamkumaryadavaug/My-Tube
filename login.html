<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Log In — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="card auth-card">
    <div class="auth-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to keep your focus streak going.</p>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" class="input" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" class="input" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>

    <div style="display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text-secondary,#a1a1aa);font-size:.85rem;">
      <span style="height:1px;background:var(--border,rgba(255,255,255,.08));flex:1"></span>
      <span>or</span>
      <span style="height:1px;background:var(--border,rgba(255,255,255,.08));flex:1"></span>
    </div>

    <button type="button" class="btn btn-block" id="guestBtn">Continue as Guest</button>

    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('Service worker registered:', reg.scope))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>

</body>
</html>
