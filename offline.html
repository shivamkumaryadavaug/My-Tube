<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff202f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTube">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="color-scheme" content="dark">
<title>Offline — MyTube</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}main{width:min(520px,100%);padding:42px 30px;border:1px solid rgba(255,32,47,.35);border-radius:28px;background:linear-gradient(145deg,#151515,#090909);box-shadow:0 24px 80px rgba(255,32,47,.12);text-align:center}.logo{width:76px;height:76px;margin:0 auto 22px;border:2px solid #ff202f;border-radius:22px;display:grid;place-items:center;box-shadow:0 0 35px rgba(255,32,47,.28)}.logo span{font-size:34px;color:#ff202f}h1{font-size:30px;margin:0 0 12px}p{color:#aaa;line-height:1.6;margin:0 auto 26px}.btn{border:0;border-radius:14px;padding:14px 24px;background:#ff202f;color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 30px rgba(255,32,47,.25)}.hint{font-size:13px;color:#777;margin-top:18px}</style>
</head>
<body><main><div class="logo"><span>▶</span></div><h1>You’re offline</h1><p>MyTube is ready when your connection returns. Reconnect to continue your focused learning session.</p><button class="btn" onclick="location.reload()">Try again</button><div class="hint">Your saved app shell is still available.</div></main></body>
</html>
