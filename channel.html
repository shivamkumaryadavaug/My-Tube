<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/library.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">🏠 Home</a>
      <a class="nav-item" href="library.html">📚 Library</a>
      <a class="nav-item" href="study.html">🎯 Study Mode</a>
      <a class="nav-item" href="progress.html">📊 Progress</a>
      <div class="sidebar-divider"></div>
      <a class="nav-item" href="settings.html">⚙️ Settings</a>
    </nav>
  </aside>

  <main class="main-content" id="channelRoot">
    <a href="library.html" class="btn btn-ghost btn-sm" style="margin-bottom:20px;">← Back</a>

    <div class="card" style="padding:28px;margin-bottom:30px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
      <div class="channel-avatar" id="channelAvatar" style="width:72px;height:72px;font-size:1.4rem;margin-bottom:0;"></div>
      <div>
        <h1 id="channelName" style="font-size:1.4rem;font-weight:800;margin-bottom:6px;">Loading…</h1>
        <p id="channelDescription" style="color:var(--text-secondary);margin-bottom:8px;max-width:520px;"></p>
        <span class="pill accent" id="channelSelectedCount"></span>
      </div>
    </div>

    <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:14px;">Your Selected Content</h2>
    <div class="content-grid" id="channelPlaylists" style="margin-bottom:36px;"></div>

    <div class="card selection-panel" id="chSelectionPanel">
      <h2>Choose What You Want to Study</h2>
      <p class="panel-sub">Add more playlists or individual videos from this channel.</p>

      <div class="select-group">
        <h4>Playlists</h4>
        <div id="chSelectPlaylists"></div>
      </div>
      <div class="select-group">
        <h4>Individual videos</h4>
        <div id="chSelectVideos"></div>
      </div>

      <div class="selection-actions">
        <div class="selection-actions-left">
          <button class="btn btn-ghost btn-sm" id="chSelectAllBtn" type="button">Select All</button>
          <button class="btn btn-ghost btn-sm" id="chClearAllBtn" type="button">Clear</button>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <span class="selected-count-label"><b id="chSelectedCount">0</b> selected</span>
          <button class="btn btn-primary" id="chAddSelectedBtn" type="button">Add Selected Content</button>
        </div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html">🏠<span>Home</span></a>
  <a class="nav-item" href="library.html">📚<span>Library</span></a>
  <a class="nav-item" href="study.html">🎯<span>Study</span></a>
  <a class="nav-item" href="progress.html">📊<span>Progress</span></a>
</nav>

<script src="js/app.js"></script>
<script src="js/channel.js"></script>
</body>
</html>
