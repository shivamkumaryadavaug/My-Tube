<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff202f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTube">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="color-scheme" content="dark">
<title>Create Account — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=20250918a">
</head>
<body>

<div class="auth-shell">

  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;">
    <div class="auth-brandbar">
      <div class="auth-brand-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
      <h2>Your Library. Your Learning. <span>All in One Place.</span></h2>
      <p>Create your account and study without the distractions.</p>
    </div>

    <div class="auth-feature-strip">
      <span class="auth-feature-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H9a1.5 1.5 0 0 1 1.5 1.5v16A1.5 1.5 0 0 1 9 22H5.5A1.5 1.5 0 0 1 4 20.5z"/><path d="M13.7 4.1 17 3.2a1.5 1.5 0 0 1 1.84 1.06l4 15.46a1.5 1.5 0 0 1-1.06 1.84l-3.29.88a1.5 1.5 0 0 1-1.84-1.06l-4-15.46A1.5 1.5 0 0 1 13.7 4.1Z"/></svg>
        Organize Content
      </span>
      <span class="auth-feature-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
        Focus Timer
      </span>
      <span class="auth-feature-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        Progress Tracking
      </span>
    </div>

    <div class="auth-wrap">
      <div class="card auth-card">
        <div class="auth-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
        <h1>Create your account</h1>
        <p class="auth-sub">Study without the distractions.</p>

        <div class="auth-error" id="authError">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="authErrorText"></span>
        </div>

        <form id="registerForm">
          <div class="field">
            <label for="displayName">Name</label>
            <div class="field-icon-input">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
              <input type="text" class="input" id="displayName" placeholder="Student" autocomplete="name">
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <div class="field-icon-input">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
              <input type="email" class="input" id="email" placeholder="Enter your email" required autocomplete="email">
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="field-icon-input has-toggle">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
              <input type="password" class="input" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
              <button type="button" class="field-toggle" id="togglePassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="field-icon-input has-toggle">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
              <input type="password" class="input" id="confirmPassword" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password">
              <button type="button" class="field-toggle" id="toggleConfirmPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js?v=20250918a"></script>
<script src="js/api.js?v=20250918a"></script>
<script src="js/register.js?v=20250918a"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('Service worker registered:', reg.scope))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>

</body>
</html>
