<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Study Mode — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/study.css">

<style>
  /* Study player overrides: the old mock-player UI is replaced by YouTube IFrame Player. */
  .youtube-player-wrap {
    position: absolute;
    inset: 0;
    background: #000;
    overflow: hidden;
  }

  #youtube-player,
  #youtube-player iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
  }

  .youtube-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,.72);
    color: #fff;
    text-align: center;
    z-index: 4;
  }

  .youtube-loading.hidden {
    display: none;
  }

  .youtube-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #09090b;
    color: #fff;
    text-align: center;
    z-index: 5;
  }

  .youtube-error.show {
    display: flex;
  }

  .youtube-error-inner {
    max-width: 520px;
  }

  .youtube-error h3 {
    margin: 0 0 8px;
  }

  .youtube-error p {
    margin: 0;
    color: #a1a1aa;
    line-height: 1.5;
  }

  .player-overlay-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 3;
    opacity: 1;
    transition: opacity .2s ease;
  }

  .player-overlay-play.hidden {
    opacity: 0;
  }

  .player-overlay-play button {
    width: 72px;
    height: 72px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,59,48,.94);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 10px 34px rgba(0,0,0,.35);
    pointer-events: auto;
  }

  .player-overlay-play button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
  }

  .player-scrub {
    touch-action: none;
  }

  .player-scrub-fill {
    width: 0%;
  }

  .study-player-time {
    color: #fff;
    font-family: var(--font-mono);
    font-size: .76rem;
    white-space: nowrap;
  }

  .study-player-status {
    color: rgba(255,255,255,.75);
    font-size: .74rem;
    margin-left: 8px;
  }

  @media (max-width: 640px) {
    .player-overlay-play button {
      width: 60px;
      height: 60px;
      font-size: 23px;
    }
  }
</style>
  <link rel="stylesheet" href="css/premium-ui.css">
</head>

<body>
<div class="study-shell" id="studyRoot">

  <div class="study-topbar">
    <a href="library.html" class="back-link">← Back</a>
    <span class="playlist-title" id="topbarPlaylistTitle">Loading…</span>
    <button class="focus-badge" id="focusModeBtn" type="button">🎯 Focus Mode</button>
  </div>

  <div class="study-layout">
    <div class="study-main">
      <div class="player" id="studyPlayer">

        <div class="player-visual" id="playerVisual">
          <div class="youtube-player-wrap">
            <div id="youtube-player" aria-label="YouTube study video player"></div>
          </div>

          <div class="youtube-loading" id="youtubeLoading">
            <span>Loading video…</span>
          </div>

          <div class="youtube-error" id="youtubeError" role="alert">
            <div class="youtube-error-inner">
              <h3>Video unavailable</h3>
              <p id="youtubeErrorMessage">This YouTube video could not be loaded.</p>
            </div>
          </div>

          <div class="player-overlay-play" id="centerPlayBtnWrap">
            <button id="centerPlayBtn" type="button" aria-label="Play video">▶</button>
          </div>
        </div>

        <div class="player-controls">
          <div
            class="player-scrub"
            id="playerScrub"
            role="slider"
            aria-label="Video progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            tabindex="0"
          >
            <div class="player-scrub-fill" id="playerScrubFill"></div>
          </div>

          <div class="player-controls-row">
            <div class="player-controls-left">
              <button id="prevBtn" type="button" aria-label="Previous video">⏮</button>
              <button id="playPauseBtn" type="button" aria-label="Play or pause">
                <span id="playIcon">▶</span>
              </button>
              <button id="nextBtn" type="button" aria-label="Next video">⏭</button>
              <span class="study-player-time" id="playerTime">0:00 / 0:00</span>
              <span class="study-player-status" id="playerStatus">Ready</span>
            </div>

            <div class="player-controls-right">
              <button id="fullscreenBtn" type="button" aria-label="Fullscreen">⛶</button>
            </div>
          </div>
        </div>
      </div>

      <div class="video-info">
        <h1 id="videoTitle">Loading…</h1>
        <p class="meta" id="videoMeta"></p>

        <div style="margin-top:16px;">
          <button class="btn btn-secondary btn-sm" id="markCompleteBtn" type="button">
            Mark as complete
          </button>
        </div>
      </div>
    </div>

    <aside class="study-side">
      <div class="timer-card">
        <div class="timer-label">Focus Session</div>

        <div class="timer-ring-wrap">
          <svg viewBox="0 0 172 172" aria-hidden="true">
            <circle class="timer-ring-bg" cx="86" cy="86" r="76"/>
            <circle
              class="timer-ring-fill"
              id="timerRingFill"
              cx="86"
              cy="86"
              r="76"
              stroke-dasharray="477.5"
              stroke-dashoffset="0"
            />
          </svg>

          <div class="timer-display">
            <div class="timer-time" id="timerTime">25:00</div>
            <div class="timer-sub">Stay focused</div>
          </div>
        </div>

        <div class="timer-presets">
          <button class="preset-btn" data-minutes="25" type="button">25 min</button>
          <button class="preset-btn" data-minutes="50" type="button">50 min</button>
          <button class="preset-btn" data-minutes="90" type="button">90 min</button>
          <button class="preset-btn" id="customPresetBtn" type="button">Custom</button>
        </div>

        <div class="timer-actions">
          <button class="btn btn-primary btn-block" id="timerStartBtn" type="button">
            Start Focus
          </button>
          <button class="btn btn-icon" id="timerResetBtn" type="button" aria-label="Reset timer">↺</button>
        </div>

        <div class="timer-complete-msg" id="timerCompleteMsg">
          🎉 Focus session completed!
        </div>
      </div>

      <div class="queue-title" id="queuePlaylistTitle">Playlist</div>
      <div class="queue-list" id="studyQueueList"></div>
    </aside>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/api.js"></script>

<!-- Official YouTube IFrame Player API. No API key is required for the IFrame player. -->
<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/study.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('Service worker registered:', reg.scope))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>

</body>
</html>
