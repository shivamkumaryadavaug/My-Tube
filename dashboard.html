<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff202f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTube">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="color-scheme" content="dark">
<title>Home — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=20250919b">
<link rel="stylesheet" href="css/dashboard.css?v=20250919b">
  <link rel="stylesheet" href="css/premium-ui.css?v=20250919b">
</head>
<body class="app-page">
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
    <nav class="sidebar-nav" data-app-sidebar-nav></nav>
  </aside>

  <main class="main-content dashboard-main">


    <div class="greeting-card">
      <div class="greeting-copy">
        <h1 id="greetingText">Good morning 👋</h1>
        <p>Ready to focus?</p>
        <a href="study.html" class="btn btn-primary">Start Studying</a>
      </div>
    </div>

    <section class="dash-section continue-section">
      <div class="dash-section-head">
        <h2>Continue Learning</h2>
        <a href="library.html">View Library</a>
      </div>
      <div class="playlist-grid" id="continuePlaylists"></div>
    </section>

    <section class="dash-section focus-section">
      <div class="dash-section-head"><h2>Today's Focus</h2></div>
      <div class="stat-grid">
        <div class="card stat-card">
          <div class="stat-icon">◷</div>
          <div class="stat-value"><span id="todayMinutes">0</span> min</div>
          <div class="stat-label">Focus Time</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon">◎</div>
          <div class="stat-value" id="todaySessions">0</div>
          <div class="stat-label">Sessions</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon">▷</div>
          <div class="stat-value" id="todayVideos">0</div>
          <div class="stat-label">Videos</div>
        </div>
      </div>
    </section>

    <section class="dash-section streak-section">
      <div class="dash-section-head"><h2>Study Streak</h2></div>
      <div class="streak-card">
        <div class="streak-flame">🔥</div>
        <div>
          <h3 id="streakValue">0 Day Streak</h3>
          <p>Keep going!</p>
        </div>
      </div>
    </section>
  </main>
</div>

<nav class="bottom-nav" data-app-bottom-nav></nav>

<script src="js/app.js?v=20250919b"></script>
<script src="js/api.js?v=20250919b"></script>
<script src="js/dashboard.js?v=20250919b"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('Service worker registered:', reg.scope))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>

</body>
</html>
