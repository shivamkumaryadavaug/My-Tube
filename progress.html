<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/progress.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">🏠 Home</a>
      <a class="nav-item" href="library.html">📚 Library</a>
      <a class="nav-item" href="study.html">🎯 Study Mode</a>
      <a class="nav-item" href="progress.html">📊 Progress</a>
      <div class="sidebar-divider"></div>
      <a class="nav-item" href="settings.html">⚙️ Settings</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Your Progress</h1>
      <p>Every focused session, tracked.</p>
    </div>

    <div class="progress-stat-grid">
      <div class="card progress-stat-card"><div class="val" id="statTotalTime">0h 0m</div><div class="lbl">Total Study Time</div></div>
      <div class="card progress-stat-card"><div class="val" id="statVideos">0</div><div class="lbl">Videos Completed</div></div>
      <div class="card progress-stat-card"><div class="val" id="statSessions">0</div><div class="lbl">Study Sessions</div></div>
      <div class="card progress-stat-card"><div class="val">🔥 <span id="statStreak">0</span></div><div class="lbl">Day Streak</div></div>
    </div>

    <div class="card chart-card">
      <h2>Weekly Activity</h2>
      <div class="chart-bars" id="weeklyChart"></div>
    </div>

    <div class="card">
      <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:20px;">Course Progress</h2>
      <div class="course-list" id="courseList"></div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html">🏠<span>Home</span></a>
  <a class="nav-item" href="library.html">📚<span>Library</span></a>
  <a class="nav-item" href="study.html">🎯<span>Study</span></a>
  <a class="nav-item" href="progress.html">📊<span>Progress</span></a>
</nav>

<script src="js/app.js"></script>
<script src="js/progress.js"></script>
</body>
</html>
