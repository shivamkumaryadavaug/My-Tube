name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.json'
      - 'sw.js'
      - 'offline.html'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses (using the runner's preinstalled SDK)
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install npm dependencies
        run: npm install

      - name: Sync frontend into www/ (mirrors the live web app into the Android bundle)
        run: |
          mkdir -p www
          rm -rf www/*
          cp -r *.html css js assets manifest.json sw.js www/

      - name: Add Android platform (generated fresh every run by Capacitor — not committed to the repo)
        run: npx cap add android

      - name: Copy custom app icon and splash screen into the Android project
        run: |
          rm -f android/app/src/main/res/values/ic_launcher_background.xml
          cp -rf android-res/* android/app/src/main/res/

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytube-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
