<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist — MyTube</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/study.css">
  <link rel="stylesheet" href="css/premium-ui.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo"><img src="assets/logo.svg" alt="MyTube logo"> MyTube</div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">🏠 Home</a>
      <a class="nav-item" href="library.html">📚 Library</a>
      <a class="nav-item" href="study.html">🎯 Study Mode</a>
      <a class="nav-item" href="progress.html">📊 Progress</a>
      <div class="sidebar-divider"></div>
      <a class="nav-item" href="settings.html">⚙️ Settings</a>
    </nav>
  </aside>

  <main class="main-content" id="playlistRoot">
    <a href="library.html" class="btn btn-ghost btn-sm" style="margin-bottom:20px;">← Back</a>

    <div class="card" style="padding:28px;margin-bottom:26px;">
      <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center;">
        <div id="playlistThumb" style="width:160px;height:100px;border-radius:14px;flex-shrink:0;"></div>
        <div style="flex:1;min-width:220px;">
          <h1 id="playlistName" style="font-size:1.4rem;font-weight:800;margin-bottom:6px;">Loading…</h1>
          <p id="playlistChannel" style="color:var(--text-secondary);margin-bottom:10px;"></p>
          <div style="display:flex;gap:16px;align-items:center;font-size:.86rem;color:var(--text-secondary);margin-bottom:12px;">
            <span id="playlistCount"></span>
            <span id="playlistPercent" style="font-family:var(--font-mono);color:var(--text-primary);font-weight:700;"></span>
          </div>
          <div class="progress-track" style="max-width:320px;margin-bottom:16px;"><div class="progress-fill" id="playlistProgressFill" style="width:0%"></div></div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <a href="#" id="continueBtn" class="btn btn-primary">Continue Studying</a>
            <a href="#" id="startOverBtn" class="btn btn-secondary">Start from Beginning</a>
            <button class="btn btn-ghost" id="deletePlaylistBtn" type="button">Remove Playlist</button>
          </div>
        </div>
      </div>
    </div>

    <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:14px;">Videos</h2>
    <div class="queue-list" id="videoList"></div>
  </main>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html">🏠<span>Home</span></a>
  <a class="nav-item" href="library.html">📚<span>Library</span></a>
  <a class="nav-item" href="study.html">🎯<span>Study</span></a>
  <a class="nav-item" href="progress.html">📊<span>Progress</span></a>
</nav>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/playlist.js"></script>
</body>
</html>
